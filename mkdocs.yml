site_name: RoboSub Software and Documentation Hub
site_description: Software documentation for the RoboSub team
site_url: https://crt.robosub.io/

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - General tools:
      - AI: general-tools/AI.md
      - Git: general-tools/git.md

  - Software:
      - Setup: software/setup.md

  - Mechanical:
      - Solidworks Setup:
          - Windows: mechanical/solidworks-setup/windows.md
          - Mac / Linux: mechanical/solidworks-setup/mac-linux.md

  - Firmware:
      - Hydrophone: firmware/HydrophoneBoard.md
      - Pressure Transducer: PressureTransducerBoard.md
    

  - Guidelines:
      - guidelines.md
      
strict: true
